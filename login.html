<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapelaria Trapalhões | Login</title>
</head>
<body>
  <header>
    <a href="index.html">Chapelaria Trapalhões</a>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="cadastroProdutos.html">Cadastro de Produtos</a></li>
        <li><a href="login.html" aria-current="page">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-page">
    <section class="login-card">
      <img class="login-logo" src="img/logo.png" alt="Logo da Chapelaria Trapalhões" width="120" height="120">
      <h1>Login do administrador</h1>
      <p>Acesso restrito a administradores da loja.</p>
      <form id="form-login" action="#" method="post">
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <div>
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Breno Henrique, Enzo Noah, Gustavo Santos, Júlio César e Matheus Henrique.</p>
  </footer>
</body>
</html>
