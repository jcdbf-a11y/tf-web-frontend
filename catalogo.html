
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapelaria DM HATS | Catálogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/feedback.css">
</head>

<body>
  <header>
    <a class="marca" href="index.html">Chapelaria DM HATS</a>

    <nav aria-label="Navegação principal">
      <ul id="menu-principal"></ul>
    </nav>
  </header>

  <main>
    <h1>Catálogo</h1>

    <section>
      <h2>Filtrar produtos</h2>

      <form class="filtro" id="form-filtro">
        <div>
          <label for="filtro-tipo">Tipo</label>

          <select id="filtro-tipo" name="tipo">
            <option value="">Todos</option>
            <option value="CHAPEU_PRONTO">Chapéus prontos</option>
            <option value="ITEM_MONTAGEM">Itens para montagem</option>
          </select>
        </div>

        <button type="submit">Filtrar</button>
      </form>
    </section>

    <p id="mensagem-catalogo" role="status"></p>

    <section id="secao-chapeus">
      <h2>Chapéus prontos</h2>
      <div class="cards" id="lista-chapeus"></div>
    </section>

    <section id="secao-montagem">
      <h2>Itens para montagem</h2>
      <div class="cards" id="lista-montagem"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Breno Henrique, Enzo Noah, Gustavo Santos, Júlio César e Matheus Henrique.</p>
  </footer>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
